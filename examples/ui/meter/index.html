  <title>Tea UI · meter</title>
  <style>:root {font: 18px/1.55 "Trebuchet MS", sans-serif; color:#16344a; background:#eaf4f8;}
body {margin:0} main {max-width:50rem; margin:3rem auto; padding:0 1.5rem 4rem;}
h1 {font-size:clamp(2rem,6vw,3.6rem); line-height:1.1; margin-bottom:1rem; letter-spacing:-.04em}
h2 {font-size:1.3rem} p {max-width:65ch} section {margin-top:2rem; padding:1.5rem; background:#fff; border-left:.35rem solid #156a92}
label {display:inline-block; margin:.5rem 1rem .5rem 0}
button, select, input {font:inherit; color:inherit} button,select {padding:.45rem .8rem; background:#fff; border:2px solid #156a92; border-radius:.25rem}
button {cursor:pointer} button[data-open],a[data-current] {background:#156a92; color:#fff}
:focus-visible {outline:3px solid #9c3508; outline-offset:4px}
.track {height:2.5rem; background:#d4e6ee; margin:1rem 0; position:relative; border:2px solid #476c80}
.track::before {content:""; display:block; height:100%; width:var(--tea-meter-percent,var(--tea-progress-percent,0%)); background:#156a92}
.track[data-state=optimum]::before,.track[data-state=complete]::before {background:#276243}
.track[data-state=suboptimal]::before {background:#996100}
.track[data-state=critical]::before {background:#a52b37}
.track[data-state=indeterminate]::before {width:40%; background:repeating-linear-gradient(90deg,#156a92 0 1rem,#d4e6ee 1rem 1.3rem)}
.reading {font-size:1.2rem} nav ul {display:flex; flex-wrap:wrap; gap:1rem; padding-left:1.5rem}
a {color:#075681; text-underline-offset:.2em} nav a {display:inline-block; padding:.4rem .7rem}
[data-closed] + [data-closed] {border-color:#476c80}
.panel {padding:1rem; border:2px solid #156a92}
</style>
