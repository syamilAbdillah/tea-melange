  <title>Tea UI · File drop</title>
  <style>
    :root { font: 18px/1.6 "Trebuchet MS", sans-serif; color: #153945; background: #e7f4f7; }
    body { margin: 0; }
    main { max-width: 46rem; padding: 3rem 1.5rem; margin: auto; }
    h1 { font-size: clamp(2.5rem, 8vw, 4rem); line-height: 1.1; margin: 0 0 1rem; letter-spacing: -.05em; }

    .drop-target { margin: 1rem 0; padding: 1.4rem; border: 3px dashed #397187; background: #fff; }

    .drop-target[data-disabled] { opacity: .7; }
    .drop-target p { margin-top: 0; }
    .drop-detail { margin-bottom: 1rem; }
    button { font: inherit; padding: .6rem 1.1rem; border: 2px solid #17465a; background: #17465a; color: #fff; border-radius: .25rem; cursor: pointer; }
    button[data-disabled] { cursor: not-allowed; }
    :focus-visible { outline: 3px solid #8b1860; outline-offset: 4px; }
    .accepted { border-left: 4px solid #246343; padding-left: 1rem; }
    .rejected { border-left: 4px solid #9c263d; padding-left: 1rem; color: #852035; }
    #results { min-height: 4rem; }
