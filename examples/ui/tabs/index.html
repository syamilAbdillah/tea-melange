    :root { font: 17px/1.6 Tahoma, sans-serif; color: #182b44; background: #edf3fa; }

    [role=tabpanel] { background: white; padding: 1rem; border-bottom: 3px solid #305a91; }
    :focus-visible { outline: 3px solid #9a3600; outline-offset: 4px; }
