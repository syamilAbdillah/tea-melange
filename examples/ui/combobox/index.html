  <style>
:root { font: 17px/1.5 "Trebuchet MS", sans-serif; color: #173b49; background: #edf6fa; }
body { margin: 0; } main { max-width: 52rem; margin: 3rem auto; padding: 0 1.5rem 4rem; }
h1 { font: 600 2.8rem/1.15 "Trebuchet MS", sans-serif; letter-spacing: -.07rem; }
h2 { font-size: 1.2rem; } p { max-width: 65ch; } section { margin: 2rem 0; }
label { display: block; font-weight: bold; } .wrapper { display: flex; max-width: 30rem; }
input, button { font: inherit; padding: .55rem .8rem; color: inherit; border: 2px solid #336578; background: white; }
input { min-width: 0; flex: 1; } button { cursor: pointer; }
:focus-visible { outline: 3px solid #915000; outline-offset: 3px; }
[role=listbox] { max-height: min(15rem, var(--tea-available-height)); overflow: auto; padding: .3rem; background: white; color: #173b49; border: 2px solid #336578; }
[role=option] { padding: .45rem .7rem; cursor: pointer; }
[data-active] { outline: 2px solid #336578; outline-offset: -2px; background: #ddedf3; }
[data-selected] { font-weight: bold; } [data-disabled] { color: #52646c; cursor: not-allowed; }
.chips { display: flex; gap: .5rem; flex-wrap: wrap; margin-top: .6rem; }
.chips span { background: #d5e8f0; padding-inline-start: .6rem; }
.chips button { border: 0; background: transparent; } [role=status] { min-height: 1.5em; font-size: .9rem; }
dialog { padding: 1.5rem; border: 3px solid #336578; width: min(35rem, 80vw); color: inherit; }
dialog::backdrop { background: rgb(0 30 40 / .45); } output { display: block; margin-top: 2rem; }
[role=listbox][data-transition] { transition: transform 100ms ease; }
[role=listbox][data-closed] { transform: translateY(-3px); }
@media (prefers-reduced-motion: reduce) { [role=listbox][data-transition] { transition: none; } }
@media (max-width: 40rem) { h1 { font-size: 2rem; } main { margin-top: 1.5rem; } }
