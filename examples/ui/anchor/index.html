  <title>Tea UI · Anchor</title>
  <style>
    :root { font: 16px/1.5 Verdana, sans-serif; color: #16324f; background: #edf6fc; }
    body { margin: 0; }
    main { max-width: 1100px; margin: 32px auto; padding: 0 24px; }
    h1 { font-size: clamp(1.6rem, 4vw, 2.6rem); letter-spacing: -.04em; line-height: 1.2; }
    p { max-width: 76ch; }
    .controls { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; padding: 16px 0 24px; }
    label { display: inline-flex; align-items: center; gap: 4px; }
    button, select, input { font: inherit; accent-color: #124787; }
    button, select, input[type=number] { border: 2px solid #124787; background: white; color: #16324f; padding: 6px; }
    input[type=number] { width: 64px; }
    input[type=checkbox] { width: 18px; height: 18px; }
    button { cursor: pointer; }
    :focus-visible { outline: 3px solid #8a317d; outline-offset: 3px; }
    #clip { overflow: hidden; transform: translateZ(0); border: 3px solid #124787; height: 400px; }
    #scroller { overflow: auto; height: 100%; }
    #surface { width: 1400px; height: 900px; position: relative; background-image: linear-gradient(#c7dced 1px, transparent 1px), linear-gradient(90deg, #c7dced 1px, transparent 1px); background-size: 40px 40px; }
    #resizer { position: absolute; left: 260px; top: 140px; width: 160px; height: 72px; min-width: 100px; min-height: 60px; resize: both; overflow: auto; }
    #reference { width: 100%; height: 100%; background: #124787; color: white; }
    #floating { width: 220px; height: 104px; padding: 12px; border: 2px solid #124787; background: white; color: #16324f; box-shadow: 5px 5px 0 #a7c5df; }
    #floating p { margin: 0 0 6px; font-size: 14px; }
    .hint { font-size: 14px; }
    output { display: block; padding: 10px 0 32px; font-variant-numeric: tabular-nums; }
    @media (max-width: 600px) { main { margin-top: 20px; padding: 0 12px; } #clip { height: 300px; } }
  </style>
