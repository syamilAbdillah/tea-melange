  <style>
    :root { color-scheme: light; font: 17px/1.6 Arial, sans-serif; color: #20283d; background: #f3f4fc; }
    body { margin: 0; }
    main { max-width: 54rem; margin: 3rem auto; padding: 0 1.5rem 4rem; }
    h1 { font: 600 3rem/1.1 Georgia, serif; margin-bottom: 1rem; }
    h2 { font-size: 1.2rem; margin: 0 0 .6rem; }
    p { max-width: 65ch; }
    section, form { margin-top: 2rem; padding: 1.25rem 0; border-top: 2px solid #c5cbe2; }
    .controls { display: flex; flex-wrap: wrap; align-items: center; gap: .75rem; }
    .control { display: inline-block; font: inherit; line-height: 1.5; padding: .6rem 1rem; background: #fff; color: #20283d; border: 2px solid #425898; border-radius: .3rem; cursor: pointer; user-select: none; }

    .control[data-disabled] { border-style: dashed; border-color: #747c93; color: #535c73; background: #e4e7f0; cursor: not-allowed; }
    :focus-visible { outline: 3px solid #8426a9; outline-offset: 4px; }
    input { width: 1.2rem; height: 1.2rem; vertical-align: middle; }
    label { display: inline-block; margin: 1rem 0; }
    output { display: block; padding: .75rem 1rem; margin-top: 2rem; background: #e1e7f6; border-left: 4px solid #425898; }
    code { font-size: .9em; }
