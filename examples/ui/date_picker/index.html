  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tea UI · Date picker</title>
  <style>
    :root { font: 16px/1.6 Verdana, sans-serif; color: #173d39; background: #eef8f4; }
    body { margin: 0; } main { max-width: 58rem; margin: 2rem auto; padding: 1rem 2rem 4rem; }
    h1 { font: bold clamp(2rem, 5vw, 3.5rem)/1.15 Georgia, serif; max-width: 18ch; }
    h2 { font-size: 1.15rem; } p { max-width: 66ch; }
    section { border-top: 2px solid #98c9ba; padding-block: 1rem; margin-top: 1rem; }
    label { display: block; font-weight: bold; } input, button { font: inherit; }
    input { padding: .55rem; border: 2px solid #366f60; max-width: 90%; }
    button { padding: .5rem .7rem; color: #173d39; background: white; border: 2px solid #366f60; border-radius: .25rem; cursor: pointer; }
    button[data-open], [data-selected] { background: #205c4d; color: white; }
    [data-disabled] { color: #5d6663; text-decoration: line-through; }
    [data-invalid] { border-color: #9e244c; } .error { color: #9e244c; }
    :focus-visible { outline: 3px solid #98295b; outline-offset: 3px; }
    .picker { margin-block: .6rem; } .field { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
    .panel { background: white; color: #173d39; border: 2px solid #366f60; padding: 1rem; width: min(30rem, calc(100vw - 2rem)); max-height: min(34rem, var(--tea-available-height)); overflow: auto; box-shadow: 0 .5rem 2rem #173d3930; }
    .panel h2 { margin: .4rem 0; text-align: center; } .nav { display: flex; gap: .25rem; justify-content: space-between; }
    .nav button { font-size: .8rem; padding: .35rem; } table { width: 100%; border-spacing: .25rem; table-layout: fixed; }
    th { font-size: .8rem; } td { text-align: center; padding: .4rem .1rem; border-radius: .25rem; cursor: pointer; }
    td[data-today] { box-shadow: inset 0 0 0 2px #366f60; } .actions { display: flex; justify-content: end; gap: .5rem; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
    dialog { padding: 1.5rem; border: 3px solid #366f60; } dialog::backdrop { background: #173d3970; }
    output { display: block; padding: .6rem 0; } .panel[data-transition] { transition: opacity 140ms ease; } .panel[data-closed] { opacity: 0; }
    @media (prefers-reduced-motion: reduce) { .panel[data-transition] { transition: none; } }
  </style>
